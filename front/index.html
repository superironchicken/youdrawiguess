<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>你画我猜</title>
        <link rel="stylesheet" href="style.css">
        <!-- socket.io 客户端要先于模块加载，模块里直接用全局的 io() -->
        <script src="/socket.io/socket.io.js"></script>
        <script type="module" src="js/main.js"></script>
    </head>
    <body>
        <input id="nameinput" placeholder="你的名字">
        <button id="createbtn">创建房间</button>
        <input id="roominput" placeholder="输入房间号">
        <button id="joinbtn">加入房间</button>
        <span id="myroom">当前没有房间</span>
        <button id="startbtn">开始游戏（房主）</button>
        <span id="status">等待加入</span>
        <span id="countdown"></span>
        <div id="toolbar">
            <input type="color" id="colorpick" value="#ff0000">选择颜色
            <input type="range" id="widthpick" min="1" max="10" value="4">1-10
            <button id="clearbtn">清空画布</button>
            <button id="undobtn">撤销上一笔</button>
        </div>
        <canvas id="board" width="800" height="500"></canvas>
        <div id="panel"></div>
        <div id="scorepanel">
            <div id="scoretitle">分数榜（先到100分胜）</div>
            <ul id="scorelist"></ul>
        </div>
    </body>
</html>
